<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gumampio Store</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 35px 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 30px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 40px;
      margin: 5px 0 10px;
    }

    .description {
      color: #999;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 25px;
      padding: 18px 22px;
      margin: 15px 0;
      transition: 0.2s;
    }

    .link:hover {
      background: #222222;
      transform: translateY(-2px);
    }

    .icon {
      width: 55px;
      height: 55px;
      border-radius: 18px;
      background: #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-right: 18px;
    }

    .text {
      text-align: left;
      flex: 1;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .sub {
      color: #888;
      font-size: 15px;
    }

    .arrow {
      color: #777;
      font-size: 25px;
    }

    .info {
      margin-top: 40px;
      text-align: left;
      color: #aaa;
      line-height: 1.6;
    }

    .info h2 {
      color: white;
      text-align: center;
      font-size: 24px;
      margin-bottom: 15px;
    }

    .info p {
      margin-bottom: 15px;
    }

    footer {
      margin-top: 50px;
      padding-top: 25px;
      border-top: 1px solid #292929;
      text-align: center;
    }

    .footer-brand {
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .footer-services {
      color: #777;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .footer-copy {
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="gumampio-logo.png" alt="Gumampio Store" class="logo">

    <h1>Gumampio Store</h1>

    <div class="description">
      Link resmi & pusat informasi Gumampio Store
    </div>
