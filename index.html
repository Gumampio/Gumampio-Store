<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gumampio Store</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {

  <div class="container">

    <img src="gumampio-store.png" class="logo" alt="Logo Gumampio Store">

    <h1>Gumampio Store</h1>

</body>
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 35px 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 30px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 40px;
      margin: 5px 0 10px;
    }

    .description {
      color: #999;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: white;
      background: #181818;
      border: 1px solid #292929;
      border-radius: 25px;
      padding: 18px 22px;
      margin: 15px 0;
      transition: 0.2s;
    }

    .link:hover {
      background: #222222;
      transform: translateY(-2px);
    }

    .icon {
      width: 55px;
      height: 55px;
      border-radius: 18px;
      background: #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-right: 18px;
    }

    .text {
      text-align: left;
      flex: 1;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .sub {
      color: #888;
      font-size: 15px;
    }

    .arrow {
      color: #777;
      font-size: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="gumampio-logo.png" class="logo" alt="Gumampio Store">

    <h1>Gumampio Store</h1>

    <div class="description">
      Link resmi & pusat informasi Gumampio Store
    </div>

    <a class="link" href="LINK_WHATSAPP" target="_blank">
      <div class="icon">💬</div>
      <div class="text">
        <div class="title">Grup WhatsApp</div>
        <div class="sub">Gabung komunitas Gumampio Store</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="LINK_TELEGRAM" target="_blank">
      <div class="icon">📢</div>
      <div class="text">
        <div class="title">Channel / Telegram</div>
        <div class="sub">Info dan update terbaru</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="LINK_INSTAGRAM" target="_blank">
      <div class="icon">📸</div>
      <div class="text">
        <div class="title">Instagram</div>
        <div class="sub">Follow akun resmi</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="LINK_TIKTOK" target="_blank">
      <div class="icon">🎵</div>
      <div class="text">
        <div class="title">TikTok</div>
        <div class="sub">Konten Gumampio Store</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="link" href="LINK_MARKETPLACE" target="_blank">
      <div class="icon">🛒</div>
      <div class="text">
        <div class="title">Marketplace</div>
        <div class="sub">Lihat produk yang tersedia</div>
      </div>
      <div class="arrow">›</div>
    </a>

  </div>

</body>
</html>
